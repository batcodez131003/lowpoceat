{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Explorer - LowPoceat</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Gothic+A1:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #FF5E6C;
            --secondary-color: #FFAAAB;
            --accent-color: #FEB300;
            --background-dark: #FFF5D7;
            --background-light: #FFFFFF;
            --text-dark: #2A2A2A;
            --text-light: #5A5A5A;
            --navbar-background: #FFFFFF;
            --gradient-soft: linear-gradient(135deg, #FF5E6C 0%, #FEB300 100%);
            --shadow-glow: 0 8px 25px rgba(255, 94, 108, 0.2);
            --border-radius: 20px;
            --navbar-height: 80px;
        }
        .dark-mode {
            --primary-color: #FF5E6C;
            --secondary-color: #FFAAAB;
            --accent-color: #FEB300;
            --background-dark: #000000;
            --background-light: #1A1A1A;
            --text-dark: #FFF5D7;
            --text-light: #C2C2C2;
            --navbar-background: #333333;
            --shadow-glow: 0 8px 25px rgba(255, 94, 108, 0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; transition: all 0.3s ease; }
        body {
            font-family: 'Gothic A1', sans-serif;
            background: var(--background-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: -20%; left: -20%;
            width: 140%; height: 140%;
            background: linear-gradient(45deg, rgba(255,94,108,0.1), rgba(254,179,0,0.1));
            animation: shift 20s infinite ease-in-out;
            z-index: -1;
        }
        @keyframes shift {
            0%, 100% { transform: translate(0,0); }
            50% { transform: translate(10%,10%); }
        }

        /* Navbar */
        .navbar {
            position: fixed; top: 0; width: 100%;
            padding: 20px 60px;
            background: var(--navbar-background);
            backdrop-filter: blur(12px);
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            height: var(--navbar-height);
        }
        .navbar.scrolled { padding: 15px 60px; box-shadow: var(--shadow-glow); }
        .navbar .logo { width: 160px; transition: transform 0.3s ease; }
        .navbar .logo:hover { transform: scale(1.05); }
        .nav-links { display: flex; gap: 30px; align-items: center; }
        .nav-links a {
            font-size: 1rem; text-decoration: none;
            color: var(--text-light); font-weight: 500;
            text-transform: uppercase; padding: 8px 16px;
            border-radius: 10px; position: relative;
        }
        .nav-links a::after {
            content: ''; position: absolute;
            width: 0; height: 2px; bottom: 0; left: 50%;
            background: var(--accent-color);
            transition: all 0.3s ease; transform: translateX(-50%);
        }
        .nav-links a:hover { color: var(--accent-color); }
        .nav-links a:hover::after { width: 60%; }
        .hamburger { display: none; font-size: 28px; color: var(--text-light); cursor: pointer; }
        .dark-mode-toggle {
            width: 40px; height: 40px;
            background: var(--primary-color); border: none;
            border-radius: 50%; color: var(--text-dark);
            font-size: 18px; cursor: pointer;
        }
        .dark-mode-toggle:hover { background: var(--accent-color); transform: scale(1.1); }

        /* Container */
        .container {
            width: 90%; max-width: 1300px;
            margin: calc(var(--navbar-height) + 20px) auto 40px;
            padding: 40px;
            background: rgba(255,255,255,0.9);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-glow);
            backdrop-filter: blur(12px);
            position: relative; z-index: 1;
            animation: fadeInUp 0.8s ease-out;
        }
        .dark-mode .container { background: rgba(26,26,26,0.9); }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--accent-color);
            flex-wrap: wrap; gap: 20px;
        }
        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 6vw, 2.5rem);
            font-weight: 700; color: var(--primary-color);
            text-transform: uppercase; letter-spacing: 1px;
        }

        /* Search bar */
        .search-bar {
            display: flex; align-items: center;
            background: var(--background-dark);
            border-radius: 50px; padding: 10px 20px;
            box-shadow: var(--shadow-glow); gap: 10px;
            border: 2px solid transparent;
            transition: border-color 0.3s;
        }
        .search-bar:focus-within { border-color: var(--primary-color); }
        .search-bar input {
            border: none; background: transparent;
            font-size: 15px; color: var(--text-dark);
            outline: none; width: 220px;
        }
        .search-bar i { color: var(--text-light); }

        .filters {
            display: flex; gap: 15px;
            flex-wrap: wrap; align-items: center;
            margin-bottom: 20px;
        }
        .filters select {
            padding: 12px 16px;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 10px;
            background: var(--background-light);
            color: var(--text-dark);
            font-size: 1rem;
            font-family: 'Gothic A1', sans-serif;
            cursor: pointer;
        }
        .dark-mode .filters select {
            background: var(--background-dark);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-light);
        }
        .filters select:focus { outline: none; border-color: var(--accent-color); }

        .slider-container { position: relative; width: 200px; display: flex; align-items: center; }
        .filters input[type="range"] {
            -webkit-appearance: none; width: 100%; height: 8px;
            background: var(--gradient-soft); border-radius: 5px; outline: none; cursor: pointer;
        }
        .filters input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 24px; height: 24px;
            background: var(--accent-color); border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2); cursor: pointer;
        }
        .slider-tooltip {
            position: absolute; top: -40px; left: 50%;
            transform: translateX(-50%);
            background: var(--primary-color); color: white;
            padding: 5px 10px; border-radius: 5px;
            font-size: 0.9rem; font-weight: 600;
            white-space: nowrap; pointer-events: none;
        }

        .meal-type-buttons {
            display: flex; justify-content: center;
            gap: 15px; margin-bottom: 30px; flex-wrap: wrap;
            background: rgba(255,255,255,0.8);
            padding: 20px; border-radius: var(--border-radius);
            box-shadow: var(--shadow-glow); backdrop-filter: blur(10px);
        }
        .dark-mode .meal-type-buttons { background: rgba(26,26,26,0.8); }
        .meal-type-buttons button {
            padding: 12px 25px;
            background: var(--primary-color);
            color: white; border: none;
            border-radius: 12px;
            font-family: 'Gothic A1', sans-serif;
            font-weight: 600; font-size: 1rem;
            text-transform: uppercase; cursor: pointer;
            transition: all 0.3s ease;
        }
        .meal-type-buttons button:hover {
            background: var(--secondary-color);
            transform: translateY(-3px);
            box-shadow: var(--shadow-glow);
        }
        .meal-type-buttons button.active {
            background: var(--accent-color);
            transform: translateY(-3px);
        }

        /* Results count */
        .results-count {
            font-size: 14px; color: var(--text-light);
            margin-bottom: 15px; padding-left: 5px;
        }
        .results-count span { color: var(--primary-color); font-weight: 700; }

        /* Loading spinner */
        .spinner {
            display: none;
            text-align: center; padding: 40px;
        }
        .spinner i { font-size: 36px; color: var(--primary-color); animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* Recipe grid */
        .recipe-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px; padding: 20px;
            background: rgba(255,255,255,0.7);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-glow);
            backdrop-filter: blur(8px);
            min-height: 200px;
        }
        .dark-mode .recipe-list { background: rgba(26,26,26,0.7); }

        .recipe-item {
            background: var(--background-light);
            border-radius: 14px; padding: 25px;
            text-align: center;
            box-shadow: var(--shadow-glow);
            animation: cardFadeIn 0.4s ease-out;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .dark-mode .recipe-item { background: var(--background-dark); }
        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .recipe-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(255,94,108,0.3);
        }
        .recipe-item .meal-type-tag {
            display: inline-block;
            font-size: 11px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1px;
            color: white; background: var(--primary-color);
            padding: 3px 10px; border-radius: 20px;
            margin-bottom: 10px;
        }
        .recipe-item a {
            text-decoration: none; color: var(--text-dark);
            font-family: 'Playfair Display', serif;
            font-weight: 600; font-size: 1.2rem;
            display: block; margin-bottom: 8px;
            transition: color 0.3s ease;
        }
        .recipe-item a:hover { color: var(--primary-color); }
        .recipe-item .diet-tag {
            font-size: 12px; color: #27ae60;
            font-weight: 600; margin-bottom: 6px;
        }
        .recipe-item .cost-tag {
            font-size: 14px; color: var(--primary-color);
            font-weight: 700;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center; padding: 50px;
            color: var(--text-light);
        }
        .no-results i { font-size: 48px; margin-bottom: 15px; display: block; color: var(--secondary-color); }

        @media (max-width: 768px) {
            .navbar { padding: 15px 20px; }
            .nav-links {
                display: none; flex-direction: column;
                position: absolute; top: 100%; left: 0;
                width: 100%; background: var(--navbar-background);
                padding: 20px; text-align: center;
            }
            .nav-links.active { display: flex; }
            .hamburger { display: block; }
            .container { width: 95%; padding: 20px; margin-top: calc(var(--navbar-height) + 10px); }
            .header { flex-direction: column; text-align: center; }
            .filters { justify-content: center; }
            .meal-type-buttons { flex-direction: column; }
            .meal-type-buttons button { width: 100%; }
            .search-bar input { width: 150px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <img src="{% static 'demo/images/loogo.png' %}" alt="Logo" class="logo">
        <div class="nav-links">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'user_profile' %}">Profile</a>
            <a href="{% url 'feedback_page' %}">Feedback</a>
            {% if user.is_authenticated %}
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
            {% endif %}
            <button class="dark-mode-toggle" aria-label="Toggle Dark Mode">
                <i class="fas fa-moon"></i>
            </button>
        </div>
        <div class="hamburger"><i class="fas fa-bars"></i></div>
    </nav>

    <div class="container">
        <div class="header">
            <h1>Recipe Explorer</h1>
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="Search meals...">
            </div>
        </div>

        <div class="filters">
            <select id="diet-filter">
                <option value="">All Diets</option>
                <option value="Vegan">Vegan</option>
                <option value="Vegetarian">Vegetarian</option>
                <option value="Non-Vegetarian">Non-Vegetarian</option>
            </select>
            <select id="health-condition-filter">
                <option value="">All Health Conditions</option>
                {% for condition in health_conditions %}
                    <option value="{{ condition.name }}">{{ condition.name }}</option>
                {% endfor %}
            </select>
            <div class="slider-container">
                <input type="range" id="budget-slider" min="0" max="500" step="10" value="500">
                <span class="slider-tooltip" id="slider-tooltip">₹500</span>
            </div>
        </div>

        <div class="meal-type-buttons">
            <button onclick="setMealType('')" class="active" id="btn-all">All</button>
            <button onclick="setMealType('Breakfast')" id="btn-breakfast">Breakfast</button>
            <button onclick="setMealType('Lunch')" id="btn-lunch">Lunch</button>
            <button onclick="setMealType('Dinner')" id="btn-dinner">Dinner</button>
        </div>

        <div class="results-count">Showing <span id="result-count">0</span> meals</div>

        <div class="spinner" id="spinner">
            <i class="fas fa-circle-notch"></i>
        </div>

        <div class="recipe-list" id="recipe-list"></div>
    </div>

    <script>
        // JWT token stored from login — for AJAX API calls
        // We use cookies/session for page auth, but AJAX needs token
        // So we'll use a separate fetch to our meal list view that returns JSON

        let activeMealType = '';
        let searchTimeout = null;

        function setMealType(type) {
            activeMealType = type;
            document.querySelectorAll('.meal-type-buttons button').forEach(b => b.classList.remove('active'));
            const idMap = { '': 'btn-all', 'Breakfast': 'btn-breakfast', 'Lunch': 'btn-lunch', 'Dinner': 'btn-dinner' };
            document.getElementById(idMap[type]).classList.add('active');
            fetchMeals();
        }

        function fetchMeals() {
            const diet = document.getElementById('diet-filter').value;
            const health = document.getElementById('health-condition-filter').value;
            const budget = document.getElementById('budget-slider').value;
            const search = document.getElementById('search-input').value;

            document.getElementById('slider-tooltip').textContent = `₹${budget}`;
            document.getElementById('spinner').style.display = 'block';
            document.getElementById('recipe-list').style.opacity = '0.4';

            // Build query params
            const params = new URLSearchParams();
            if (diet) params.append('diet_suitability', diet);
            if (health) params.append('health_condition', health);
            if (budget < 500) params.append('total_cost', budget);
            if (activeMealType) params.append('meal_type', activeMealType);
            if (search) params.append('search', search);

            fetch(`/api/meals/ajax/?${params.toString()}`, {
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            })
            .then(res => res.json())
            .then(data => {
                renderMeals(data.meals);
                document.getElementById('result-count').textContent = data.count;
            })
            .catch(err => console.error('Filter error:', err))
            .finally(() => {
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('recipe-list').style.opacity = '1';
            });
        }

        function renderMeals(meals) {
            const list = document.getElementById('recipe-list');
            if (meals.length === 0) {
                list.innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-utensils"></i>
                        <p>No meals found. Try different filters.</p>
                    </div>`;
                return;
            }
            list.innerHTML = meals.map(meal => `
                <div class="recipe-item">
                    <span class="meal-type-tag">${meal.meal_type}</span>
                    <a href="/recipe_detail/${meal.id}/">${meal.name}</a>
                    <div class="diet-tag">${meal.diet_suitability}</div>
                    <div class="cost-tag">₹${meal.total_cost}</div>
                </div>
            `).join('');
        }

        // Event listeners
        document.getElementById('diet-filter').addEventListener('change', fetchMeals);
        document.getElementById('health-condition-filter').addEventListener('change', fetchMeals);
        document.getElementById('budget-slider').addEventListener('input', fetchMeals);
        document.getElementById('search-input').addEventListener('input', function() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(fetchMeals, 400); // debounce 400ms
        });

        // Dark mode
        function applyDarkMode(isDark) {
            document.body.classList.toggle('dark-mode', isDark);
            const btn = document.querySelector('.dark-mode-toggle');
            if (btn) btn.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            localStorage.setItem('darkMode', isDark ? 'enabled' : 'disabled');
        }

        document.addEventListener('DOMContentLoaded', function() {
            applyDarkMode(localStorage.getItem('darkMode') === 'enabled');

            window.addEventListener('scroll', function() {
                document.querySelector('.navbar').classList.toggle('scrolled', window.scrollY > 50);
            });

            const hamburger = document.querySelector('.hamburger');
            const navLinks = document.querySelector('.nav-links');
            if (hamburger) hamburger.addEventListener('click', () => navLinks.classList.toggle('active'));

            document.querySelector('.dark-mode-toggle').addEventListener('click', function() {
                applyDarkMode(!document.body.classList.contains('dark-mode'));
            });

            // Initial load
            fetchMeals();
        });
    </script>
</body>
</html>
